<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runner Profil – Miles Apart Running Club</title>
  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="profile-page">

    <!-- =========================
         PROFIL
    ========================== -->
    <section class="profile-hero">
      <div class="profile-avatar-wrap">
        <img id="profileAvatar" class="profile-avatar" src="" alt="Profilbild" />
      </div>

      <div class="profile-info">
        <h1 id="profileName">Runner</h1>
        <p id="profileUsername">@runner</p>
        <div id="profileLevel" class="profile-level"></div>
      </div>
    </section>

    <!-- =========================
         2026 STATS
    ========================== -->
    <section class="stats-section">
      <div class="section-heading">
        <div>
          <span class="section-kicker">Laufjahr</span>
          <h2>2026</h2>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Kilometer</span>
          <strong id="statKm">0 km</strong>
        </div>

        <div class="stat-card">
          <span class="stat-label">Läufe</span>
          <strong id="statRuns">0</strong>
        </div>

        <div class="stat-card">
          <span class="stat-label">Längster Lauf</span>
          <strong id="statLongest">0 km</strong>
        </div>

        <div class="stat-card">
          <span class="stat-label">Level</span>
          <strong id="statLevel">–</strong>
        </div>
      </div>
    </section>

    <!-- =========================
         ALL TIME PB
    ========================== -->
    <section class="highlights-section">
      <div class="section-heading">
        <div>
          <span class="section-kicker">Persönliche Bestzeiten</span>
          <h2>All-Time PB</h2>
        </div>
      </div>

      <div class="highlights-grid">

        <div class="highlight-card">
          <div class="highlight-top">
            <div>
              <div class="highlight-label">5K</div>
              <div id="pb5k" class="highlight-value">–</div>
            </div>
            <div class="highlight-icon">5K</div>
          </div>
        </div>

        <div class="highlight-card">
          <div class="highlight-top">
            <div>
              <div class="highlight-label">10K</div>
              <div id="pb10k" class="highlight-value">–</div>
            </div>
            <div class="highlight-icon">10K</div>
          </div>
        </div>

        <div class="highlight-card">
          <div class="highlight-top">
            <div>
              <div class="highlight-label">Halb-<br />Marathon</div>
              <div id="pbHalf" class="highlight-value">–</div>
            </div>
            <div class="highlight-icon">21K</div>
          </div>
        </div>

        <div class="highlight-card">
          <div class="highlight-top">
            <div>
              <div class="highlight-label">Marathon</div>
              <div id="pbMarathon" class="highlight-value">–</div>
            </div>
            <div class="highlight-icon">42K</div>
          </div>
        </div>

        <div class="highlight-card">
          <div class="highlight-top">
            <div>
              <div class="highlight-label">50K</div>
              <div id="pb50k" class="highlight-value">–</div>
            </div>
            <div class="highlight-icon">50K</div>
          </div>
        </div>

        <div class="highlight-card">
          <div class="highlight-top">
            <div>
              <div class="highlight-label">100K+</div>
              <div id="pb100k" class="highlight-value">–</div>
            </div>
            <div class="highlight-icon">100K</div>
          </div>
        </div>

      </div>
    </section>

    <!-- =========================
         RUN HISTORY
    ========================== -->
    <section class="runs-section">
      <div class="section-heading">
        <div>
          <span class="section-kicker">Aktivität</span>
          <h2>Meine Läufe</h2>
        </div>
      </div>

      <div id="runsList" class="runs-list"></div>
    </section>

    <!-- =========================
         POSTER
    ========================== -->
    <section class="poster-section">
      <div class="section-heading">
        <div>
          <span class="section-kicker">Teilen</span>
          <h2>Dein Runner Poster</h2>
        </div>
      </div>

      <div class="poster-wrap">
        <canvas id="runnerPosterCanvas" width="1080" height="1350"></canvas>
      </div>

      <div class="poster-actions">
        <button id="savePosterBtn" class="poster-btn" type="button">
          Poster speichern
        </button>

        <button id="shareWhatsAppBtn" class="poster-btn" type="button">
          WhatsApp teilen
        </button>

        <button id="shareInstagramBtn" class="poster-btn" type="button">
          Instagram teilen
        </button>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://orbrkdrsihsacsnprewf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wc3w2fSuj8ItwiF6XBoQgw_HeW5_rNW";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    /* =========================================================
       HILFSFUNKTIONEN
    ========================================================= */

    function formatDistance(value) {
      const num = Number(value || 0);

      if (!Number.isFinite(num)) return "0 km";

      return `${num.toFixed(1).replace(".", ",")} km`;
    }

    function formatTime(seconds) {
      const total = Math.round(Number(seconds || 0));

      if (!Number.isFinite(total) || total <= 0) {
        return "–";
      }

      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;

      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }

      return `${minutes}:${String(secs).padStart(2, "0")}`;
    }

    function formatPace(secondsPerKm) {
      const total = Math.round(Number(secondsPerKm || 0));

      if (!Number.isFinite(total) || total <= 0) {
        return "–";
      }

      const minutes = Math.floor(total / 60);
      const seconds = total % 60;

      return `${minutes}:${String(seconds).padStart(2, "0")} min/km`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function posterFittedText(
      ctx,
      text,
      x,
      y,
      maxWidth,
      startSize,
      minSize,
      weight = 700
    ) {
      let size = startSize;

      while (size > minSize) {
        ctx.font = `${weight} ${size}px Arial, Helvetica, sans-serif`;

        if (ctx.measureText(text).width <= maxWidth) {
          break;
        }

        size -= 1;
      }

      ctx.fillText(text, x, y);
    }

    /* =========================================================
       POSTER HELPERS
    ========================================================= */

    function posterStatBox(ctx, x, y, width, height, label, value) {
      ctx.save();

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#dce8e8";
      ctx.lineWidth = 2;

      roundRect(ctx, x, y, width, height, 26);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#667474";
      ctx.font = "600 17px Arial, Helvetica, sans-serif";
      ctx.fillText(label.toUpperCase(), x + 30, y + 36);

      ctx.fillStyle = "#142525";

      posterFittedText(
        ctx,
        value,
        x + 30,
        y + 104,
        width - 60,
        48,
        28,
        800
      );

      ctx.restore();
    }

    function posterPbBox(ctx, x, y, width, height, label, value) {
      ctx.save();

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#dce8e8";
      ctx.lineWidth = 2;

      roundRect(ctx, x, y, width, height, 26);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#27c7c7";
      roundRect(ctx, x, y, 10, height, 5);
      ctx.fill();

      ctx.fillStyle = "#667474";
      ctx.font = "700 18px Arial, Helvetica, sans-serif";
      ctx.fillText(label.toUpperCase(), x + 32, y + 38);

      ctx.fillStyle = "#142525";

      posterFittedText(
        ctx,
        value,
        x + 32,
        y + 116,
        width - 64,
        48,
        27,
        800
      );

      ctx.restore();
    }

    function roundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);

      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    /* =========================================================
       POSTER
    ========================================================= */

    function renderRunnerPoster(data) {
      const canvas = document.getElementById("runnerPosterCanvas");

      if (!canvas) return;

      const ctx = canvas.getContext("2d");

      const W = canvas.width;
      const H = canvas.height;

      ctx.clearRect(0, 0, W, H);

      /* Hintergrund */
      ctx.fillStyle = "#f5f9f8";
      ctx.fillRect(0, 0, W, H);

      /* oberer Farbbalken */
      ctx.fillStyle = "#27c7c7";
      ctx.fillRect(0, 0, W, 14);

      const padding = 72;

      /* =====================================================
         NAME
      ===================================================== */

      ctx.fillStyle = "#142525";

      const runnerName = data.name || "Runner";

      posterFittedText(
        ctx,
        runnerName,
        padding,
        105,
        W - padding * 2,
        82,
        48,
        800
      );

      /* =====================================================
         HAUPTSTATS
         
         Nur noch:
         links  = Kilometer
         rechts = Level
      ===================================================== */

      const statsTop = 155;
      const statGap = 24;
      const statWidth = (W - padding * 2 - statGap) / 2;
      const statHeight = 180;

      const kilometers = formatDistance(data.km);

      let levelValue = "–";

      if (data.level) {
        if (data.level.name) {
          levelValue = data.level.name;
        } else if (data.level.km) {
          levelValue = `Level ${data.level.km}`;
        }
      }

      posterStatBox(
        ctx,
        padding,
        statsTop,
        statWidth,
        statHeight,
        "Gelaufene Kilometer",
        kilometers
      );

      posterStatBox(
        ctx,
        padding + statWidth + statGap,
        statsTop,
        statWidth,
        statHeight,
        "Lauflevel",
        levelValue
      );

      /* =====================================================
         PB ÜBERSCHRIFT
      ===================================================== */

      const pbHeadingY = 405;

      ctx.fillStyle = "#142525";
      ctx.font = "800 34px Arial, Helvetica, sans-serif";
      ctx.fillText("Persönliche Bestzeiten", padding, pbHeadingY);

      /* =====================================================
         PB KARTEN
         
         Mehr Höhe und größere Schrift.
         2 Spalten × 3 Reihen.
      ===================================================== */

      const pbStartY = 450;
      const pbGapX = 24;
      const pbGapY = 22;

      const pbWidth = (W - padding * 2 - pbGapX) / 2;
      const pbHeight = 250;

      const pbItems = [
        {
          label: "5K",
          value: data.pb5k || "–"
        },
        {
          label: "10K",
          value: data.pb10k || "–"
        },
        {
          label: "Halbmarathon",
          value: data.pbHalf || "–"
        },
        {
          label: "Marathon",
          value: data.pbMarathon || "–"
        },
        {
          label: "50K",
          value: data.pb50k || "–"
        },
        {
          label: "100K+",
          value: data.pb100k || "–"
        }
      ];

      pbItems.forEach((item, index) => {
        const column = index % 2;
        const row = Math.floor(index / 2);

        const x = padding + column * (pbWidth + pbGapX);
        const y = pbStartY + row * (pbHeight + pbGapY);

        posterPbBox(
          ctx,
          x,
          y,
          pbWidth,
          pbHeight,
          item.label,
          item.value
        );
      });
    }

    /* =========================================================
       LEVEL
    ========================================================= */

    function getLevel(totalKm) {
      const km = Number(totalKm || 0);

      if (km >= 5000) {
        return {
          km: 5000,
          name: "Ultra Legend",
          emoji: "🏆"
        };
      }

      if (km >= 3000) {
        return {
          km: 3000,
          name: "Ultra Master",
          emoji: "🔥"
        };
      }

      if (km >= 2000) {
        return {
          km: 2000,
          name: "Ultra Runner",
          emoji: "⚡"
        };
      }

      if (km >= 1500) {
        return {
          km: 1500,
          name: "Marathoner",
          emoji: "🏃"
        };
      }

      if (km >= 1000) {
        return {
          km: 1000,
          name: "Distance Runner",
          emoji: "💪"
        };
      }

      if (km >= 750) {
        return {
          km: 750,
          name: "Road Runner",
          emoji: "👟"
        };
      }

      if (km >= 500) {
        return {
          km: 500,
          name: "Runner",
          emoji: "🏃"
        };
      }

      if (km >= 250) {
        return {
          km: 250,
          name: "Jogger",
          emoji: "🙂"
        };
      }

      if (km >= 100) {
        return {
          km: 100,
          name: "Starter",
          emoji: "🌱"
        };
      }

      return {
        km: 0,
        name: "New Runner",
        emoji: "🌱"
      };
    }

    /* =========================================================
       PROFIL
    ========================================================= */

    async function loadProfile() {
      const {
        data: { user },
        error: authError
      } = await supabaseClient.auth.getUser();

      if (authError || !user) {
        console.error("Kein eingeloggter User:", authError);
        return null;
      }

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      if (error) {
        console.error("Profil konnte nicht geladen werden:", error);
        return null;
      }

      return data;
    }

    /* =========================================================
       RUNS
    ========================================================= */

    async function loadRuns(userId) {
      const { data, error } = await supabaseClient
        .from("runs")
        .select("*")
        .eq("user_id", userId)
        .order("started_at", { ascending: false });

      if (error) {
        console.error("Läufe konnten nicht geladen werden:", error);
        return [];
      }

      return data || [];
    }

    /* =========================================================
       PB
    ========================================================= */

    async function loadPersonalBests(userId) {
      const { data, error } = await supabaseClient
        .from("runs")
        .select("*")
        .eq("user_id", userId);

      if (error) {
        console.error("PBs konnten nicht geladen werden:", error);
        return {};
      }

      const runs = data || [];

      let pb5k = null;
      let pb10k = null;
      let pbHalf = null;
      let pbMarathon = null;
      let pb50k = null;
      let pb100k = null;

      runs.forEach(run => {
        const distance = Number(
          run.distance_km ??
          run.distance ??
          0
        );

        const duration = Number(
          run.duration_seconds ??
          run.duration ??
          0
        );

        if (!distance || !duration) return;

        const pace = duration / distance;

        if (distance >= 5) {
          if (!pb5k || pace < pb5k.pace) {
            pb5k = {
              distance,
              duration,
              pace
            };
          }
        }

        if (distance >= 10) {
          if (!pb10k || pace < pb10k.pace) {
            pb10k = {
              distance,
              duration,
              pace
            };
          }
        }

        if (distance >= 21.0975) {
          if (!pbHalf || pace < pbHalf.pace) {
            pbHalf = {
              distance,
              duration,
              pace
            };
          }
        }

        if (distance >= 42.195) {
          if (!pbMarathon || pace < pbMarathon.pace) {
            pbMarathon = {
              distance,
              duration,
              pace
            };
          }
        }

        if (distance >= 50) {
          if (!pb50k || pace < pb50k.pace) {
            pb50k = {
              distance,
              duration,
              pace
            };
          }
        }

        if (distance >= 100) {
          if (!pb100k || pace < pb100k.pace) {
            pb100k = {
              distance,
              duration,
              pace
            };
          }
        }
      });

      return {
        pb5k,
        pb10k,
        pbHalf,
        pbMarathon,
        pb50k,
        pb100k
      };
    }

    function pbDisplay(pb) {
      if (!pb) return "–";

      return `${formatTime(pb.duration)} · ${formatDistance(pb.distance)}`;
    }

    /* =========================================================
       RUN LIST
    ========================================================= */

    function renderRuns(runs) {
      const container = document.getElementById("runsList");

      if (!container) return;

      if (!runs.length) {
        container.innerHTML = `
          <div class="empty-state">
            Noch keine Läufe vorhanden.
          </div>
        `;
        return;
      }

      container.innerHTML = runs.map(run => {
        const distance = Number(
          run.distance_km ??
          run.distance ??
          0
        );

        const duration = Number(
          run.duration_seconds ??
          run.duration ??
          0
        );

        const dateValue =
          run.started_at ??
          run.created_at ??
          run.date;

        const date = dateValue
          ? new Date(dateValue)
          : null;

        const formattedDate =
          date && !Number.isNaN(date.getTime())
            ? date.toLocaleDateString("de-DE", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
              })
            : "";

        return `
          <article class="run-row">
            <div class="run-row-main">
              <strong>${formatDistance(distance)}</strong>
              <span>${formatTime(duration)}</span>
            </div>
            <div class="run-row-meta">
              ${escapeHtml(formattedDate)}
            </div>
          </article>
        `;
      }).join("");
    }

    /* =========================================================
       INITIALIZE
    ========================================================= */

    async function initializePage() {
      const profile = await loadProfile();

      if (!profile) return;

      const userId = profile.id;

      const runs = await loadRuns(userId);
      const pbs = await loadPersonalBests(userId);

      const totalKm = runs.reduce((sum, run) => {
        return sum + Number(
          run.distance_km ??
          run.distance ??
          0
        );
      }, 0);

      const longestRun = runs.reduce((max, run) => {
        return Math.max(
          max,
          Number(
            run.distance_km ??
            run.distance ??
            0
          )
        );
      }, 0);

      const level = getLevel(totalKm);

      const name =
        profile.display_name ||
        profile.full_name ||
        profile.name ||
        "Runner";

      const username =
        profile.username ||
        profile.handle ||
        "";

      document.getElementById("profileName").textContent = name;

      document.getElementById("profileUsername").textContent =
        username ? `@${username.replace(/^@/, "")}` : "";

      const avatarUrl =
        profile.avatar_url ||
        profile.avatar ||
        "";

      if (avatarUrl) {
        document.getElementById("profileAvatar").src = avatarUrl;
      }

      document.getElementById("profileLevel").textContent =
        `${level.emoji} ${level.name}`;

      document.getElementById("statKm").textContent =
        formatDistance(totalKm);

      document.getElementById("statRuns").textContent =
        String(runs.length);

      document.getElementById("statLongest").textContent =
        formatDistance(longestRun);

      document.getElementById("statLevel").textContent =
        `${level.emoji} ${level.name}`;

      document.getElementById("pb5k").textContent =
        pbDisplay(pbs.pb5k);

      document.getElementById("pb10k").textContent =
        pbDisplay(pbs.pb10k);

      document.getElementById("pbHalf").textContent =
        pbDisplay(pbs.pbHalf);

      document.getElementById("pbMarathon").textContent =
        pbDisplay(pbs.pbMarathon);

      document.getElementById("pb50k").textContent =
        pbDisplay(pbs.pb50k);

      document.getElementById("pb100k").textContent =
        pbDisplay(pbs.pb100k);

      renderRuns(runs);

      const posterData = {
        name,
        km: totalKm,
        level,

        pb5k: pbDisplay(pbs.pb5k),
        pb10k: pbDisplay(pbs.pb10k),
        pbHalf: pbDisplay(pbs.pbHalf),
        pbMarathon: pbDisplay(pbs.pbMarathon),
        pb50k: pbDisplay(pbs.pb50k),
        pb100k: pbDisplay(pbs.pb100k)
      };

      renderRunnerPoster(posterData);
    }

    /* =========================================================
       POSTER SPEICHERN
    ========================================================= */

    function downloadRunnerPoster() {
      const canvas = document.getElementById("runnerPosterCanvas");

      if (!canvas) return;

      const link = document.createElement("a");

      link.download = "runner-poster.png";
      link.href = canvas.toDataURL("image/png");

      link.click();
    }

    /* =========================================================
       WHATSAPP
    ========================================================= */

    function shareWhatsApp() {
      const text =
        "Mein Runner Poster 🏃‍♂️\n\nMeine persönlichen Bestzeiten auf einen Blick.";

      const url =
        `https://wa.me/?text=${encodeURIComponent(text)}`;

      window.open(url, "_blank");
    }

    /* =========================================================
       INSTAGRAM
    ========================================================= */

    async function shareInstagram() {
      const canvas = document.getElementById("runnerPosterCanvas");

      if (!canvas) return;

      try {
        const blob = await new Promise(resolve =>
          canvas.toBlob(resolve, "image/png")
        );

        if (!blob) return;

        const file = new File(
          [blob],
          "runner-poster.png",
          { type: "image/png" }
        );

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          await navigator.share({
            files: [file],
            title: "Mein Runner Poster"
          });

          return;
        }

        alert(
          "Auf diesem Gerät kann das Poster nicht direkt an Instagram übergeben werden. Bitte speichere das Poster zuerst."
        );
      } catch (error) {
        console.error("Instagram Share Fehler:", error);
      }
    }

    /* =========================================================
       BUTTONS
    ========================================================= */

    document
      .getElementById("savePosterBtn")
      .addEventListener("click", downloadRunnerPoster);

    document
      .getElementById("shareWhatsAppBtn")
      .addEventListener("click", shareWhatsApp);

    document
      .getElementById("shareInstagramBtn")
      .addEventListener("click", shareInstagram);

    /* =========================================================
       START
    ========================================================= */

    initializePage();
  </script>
</body>
</html>
